name: Build and Release APK

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*' # Trigger when pushing a tag starting with 'v', e.g., 'v1.0.0'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  build-and-release:
    name: Build and Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: write # Needed for creating / updating GitHub Releases

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Prepare .env file
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env || touch .env
          fi

      - name: Decode Keystore or Generate Fallback
        env:
          ENCODED_STRING: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ENCODED_STRING" ]; then
            echo "$ENCODED_STRING" | base64 --decode > my-upload-key.jks
            echo "Keystore decoded successfully."
          else
            echo "KEYSTORE_BASE64 secret is missing. Generating fallback debug.keystore..."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Verify Generated APK
        run: |
          ls -la app/build/outputs/apk/release/

      - name: Prepare Named Release APK
        id: prepare_apk
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            GRADLE_VERSION=$(grep -m 1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
            VERSION="v${GRADLE_VERSION}"
          fi
          if [[ ! "$VERSION" =~ ^v ]]; then
            VERSION="v${VERSION}"
          fi
          echo "tag=$VERSION" >> $GITHUB_OUTPUT
          echo "Target Version: $VERSION"

          mkdir -p release-artifacts
          for apk in app/build/outputs/apk/release/*.apk; do
            if [ -f "$apk" ]; then
              dest="release-artifacts/s3-player-${VERSION}.apk"
              echo "Packaging $apk -> $dest"
              cp "$apk" "$dest"
            fi
          done
          ls -la release-artifacts/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: s3-player-${{ steps.prepare_apk.outputs.tag }}
          path: release-artifacts/*.apk
          if-no-files-found: error

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        with:
          files: release-artifacts/*.apk
          generate_release_notes: true
