name: Build and Release APK

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*' # Trigger when pushing a tag starting with 'v', e.g., 'v1.0.0'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  build-and-release:
    name: Build and Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: write # Needed for creating / updating GitHub Releases

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Prepare .env file
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env || touch .env
          fi

      - name: Decode Keystore
        env:
          ENCODED_STRING: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ENCODED_STRING" ]; then
            echo "$ENCODED_STRING" | base64 --decode > my-upload-key.jks
            echo "Keystore decoded successfully."
          else
            echo "KEYSTORE_BASE64 secret is missing. Fallback to debug signing config."
          fi

      - name: Build Release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Verify Generated APK
        run: |
          ls -la app/build/outputs/apk/release/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aether-s3-player-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
